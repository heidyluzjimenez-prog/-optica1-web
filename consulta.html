<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de pedido | Opti-Jiménez</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- TIPOGRAFÍA -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="img/logo.png" alt="Opti-Jiménez" class="logo-navbar">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="consulta.html">Consulta pedido</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Tienda</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contacto</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ENCABEZADO CONSULTA -->
<header class="consulta-header d-flex align-items-center text-center text-white">
    <div class="container">
        <h1 class="display-5 fw-bold">
            Consulta de pedido
        </h1>

        <p class="lead">
            Consulta el estado de tu pedido de forma rápida y sencilla.
        </p>
    </div>
</header>

<!-- CONSULTA DE PEDIDO -->
<section class="consulta-section section-lg">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="consulta-card">

                    <div class="text-center">

                        <i class="bi bi-search consulta-icon"></i>

                        <h2>Consulta tu pedido</h2>

                        <p>
                            Ingresa el número de tu pedido para conocer su estado.
                        </p>

                    </div>

                    <form id="form-consulta">

                        <div class="mb-4">
                            <label for="numero-pedido" class="form-label">
                                Número de pedido
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="numero-pedido"
                                placeholder="Ejemplo: OP-00125"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-search"></i>
                            Consultar pedido
                        </button>

                    </form>

                    <div id="resultado-pedido" class="mt-4"></div>

                </div>

            </div>

        </div>

    </div>
</section>


<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ENLACE JS -->
<script src="script.js"></script>
</body>
</html>
